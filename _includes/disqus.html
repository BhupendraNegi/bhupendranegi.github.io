{%- comment -%}
  Disqus comments, loaded lazily: the embed (and its third-party requests) is
  only fetched when the reader scrolls near the comments, or arrives on a
  #comment-… / #disqus_thread link. See initializeComments() in version-3.js.
{%- endcomment -%}
<div id="disqus_thread"></div>
<script>window.disqusShortname = {{ site.disqus | jsonify }};</script>
<noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
