name: Build and deploy to GitHub Pages

# Builds the site with the repo's own Ruby (Jekyll 4.x) and Node (Tailwind CLI),
# so production matches local. Replaces GitHub's native branch-based Jekyll build.
# NOTE: In repo Settings -> Pages, set "Build and deployment" -> Source to
# "GitHub Actions" for this workflow to become the live deploy.

on:
  push:
    branches: [main]
  # Weekly rebuild (Mondays 02:30 UTC). Build-time values — the "N years of
  # experience" figure and the footer year — would otherwise only refresh on a
  # push. The same run checks external links (job "links" below).
  # Note: GitHub pauses scheduled workflows after 60 days without repo activity.
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node packages
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build CSS and site
        env:
          JEKYLL_ENV: production
        run: |
          npm run css:build
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Runs ./bin/lint in parallel with build/deploy. It is intentionally NOT a
  # dependency of `build` or `deploy`, so a lint failure surfaces on the run
  # (red check) without ever blocking a publish. See AGENT.md "Linting".
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node packages
        run: npm ci

      - name: Lint
        run: ./bin/lint

  # External link check — weekly and on manual runs only, never on a push, so a
  # third-party outage can't turn a normal publish red. Like `lint`, it is not a
  # dependency of `build`/`deploy`. A failure here means a link on the live site
  # is dead: fix or remove it. See bin/check-links for what is ignored and why.
  links:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node packages
        run: npm ci

      - name: Check external links
        run: ./bin/check-links
