<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
  <div class="aurora-bg" aria-hidden="true">
    <span class="aurora-orb aurora-orb--1"></span>
    <span class="aurora-orb aurora-orb--2"></span>
    <span class="aurora-orb aurora-orb--3"></span>
  </div>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="translate-widget" aria-label="Translate this site">
    <div id="google_translate_element"></div>
    <button type="button" id="gt-reset" class="gt-reset" hidden>
      {% include icon.html name="rotate-ccw" class="site-icon" %} English
    </button>
  </div>

  {% include nav.html %}

  {% comment %} Icons that scripts inject at runtime (carousel arrows, modal
  close, code-copy states). version-3.js clones them via icon('name'). {% endcomment %}
  <template id="site-icons">
    {% include icon.html name="chevron-left" class="site-icon" %}
    {% include icon.html name="chevron-right" class="site-icon" %}
    {% include icon.html name="x" class="site-icon" %}
    {% include icon.html name="copy" class="site-icon" %}
    {% include icon.html name="check" class="site-icon" %}
  </template>

  <div class="site-shell">
    <div class="site-content" data-page-container>
      {{ content }}
    </div>
  </div>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'hi,es,fr,de,ja,zh-CN,ar,pt',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <!-- Loaded from the cookieless googleapis.com host: translate.google.com
       carries the visitor's Google account cookies, and accounts with the
       Translate service disabled (e.g. Workspace policy) get redirected to
       accounts.google.com/info/servicerestricted — the widget never loads. -->
  <script src="https://translate.googleapis.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>

  <!-- Reset to English. Google strips the page language from its dropdown and we
       hide its "Show original" banner, so this clears the googtrans cookie and
       reloads to restore the original. The button only shows while translated. -->
  <script type="text/javascript">
    (function () {
      function googtrans() {
        var m = document.cookie.match(/(?:^|;\s*)googtrans=([^;]+)/);
        return m ? decodeURIComponent(m[1]) : '';
      }
      function isTranslated() {
        // Google marks a translated page with a translated-ltr / translated-rtl
        // class on <html>; the cookie covers a page that loads already translated.
        if (/\btranslated-(?:ltr|rtl)\b/.test(document.documentElement.className)) { return true; }
        var parts = googtrans().split('/');
        return parts.length >= 3 && parts[2] && parts[2] !== 'en';
      }
      function syncReset() {
        var btn = document.getElementById('gt-reset');
        if (btn) { btn.hidden = !isTranslated(); }
      }
      function clearTranslation() {
        var host = window.location.hostname;
        var expired = '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/';
        document.cookie = 'googtrans' + expired;
        document.cookie = 'googtrans' + expired + '; domain=' + host;
        document.cookie = 'googtrans' + expired + '; domain=.' + host;
      }
      document.addEventListener('click', function (event) {
        if (!event.target.closest('#gt-reset')) { return; }
        clearTranslation();
        window.location.reload();
      });
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', syncReset);
      } else {
        syncReset();
      }
      // The combo translates in place (no reload). Instead of polling, react
      // to the two signals that a translation started or ended: Google toggling
      // its class on <html>, and the visitor changing the language dropdown
      // (the cookie lands a moment after the change event).
      if ('MutationObserver' in window) {
        new MutationObserver(syncReset).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
      }
      document.addEventListener('change', function (event) {
        if (event.target && event.target.classList && event.target.classList.contains('goog-te-combo')) {
          window.setTimeout(syncReset, 1500);
        }
      });
    })();
  </script>
</body>

</html>
