# /uses page content — the tools behind the work.
#
# Each group renders as a card (the page is designed around 6 cards). Per item:
#   name    (required) — the tool/thing
#   detail  (optional) — a short note
#   icon    (optional) — a Devicon class WITHOUT the leading "devicon-"
#                        (e.g. ruby-plain). Must exist in the loaded Devicon.
#   lucide  (optional) — a Lucide icon name, used when there is no Devicon glyph

- group: Editor & Terminal
  icon: monitor # lucide icon for the group heading
  items:
    - name: RubyMine
      lucide: code-2
      detail: My main IDE for Ruby and Rails work.
    - name: VS Code
      icon: vscode-plain
      detail: For everything else, with the Claude Code extension.
    - name: Terminals
      lucide: square-terminal
      detail: iTerm2 day to day; trying out Ghostty.
    - name: Shell
      lucide: terminal
      detail: zsh with Oh My Zsh.
    - name: Editor setup
      lucide: type
      detail: JetBrains Mono, Monokai Dark theme.

- group: Languages & Frameworks
  icon: code-2
  items:
    - name: Ruby & Rails
      icon: ruby-plain
      detail: Ruby 4.0.3 and Rails 8 — my main backend stack.
    - name: JavaScript / TypeScript
      icon: typescript-plain
      detail: Vanilla JS on this site; TypeScript at work and in side projects.
    - name: Node.js
      icon: nodejs-plain
      detail: 22.22.3, pinned per project with mise.
    - name: React & Next.js
      icon: react-original
      detail: For rich front ends — CronLens and HookView run on Next.js.
    - name: Tailwind CSS & GSAP
      lucide: wind
      detail: The styling and motion behind this site.
    - name: Jekyll
      icon: jekyll-plain
      detail: The static site generator powering this portfolio.

- group: AI Coding
  icon: bot
  items:
    - name: Claude Code
      lucide: terminal
      detail: Anthropic's agentic CLI — my main AI pair.
    - name: Codex
      lucide: sparkles
      detail: OpenAI's coding agent.
    - name: GitHub Copilot
      lucide: wand-2
      detail: Inline completions in the editor.

- group: Dev Tools & Infra
  icon: wrench
  items:
    - name: Git & GitHub
      icon: git-plain
      detail: Version control and where this site lives.
    - name: Docker / Colima
      icon: docker-plain
      detail: Containers and a lightweight local runtime on macOS.
    - name: Jupyter Notebook
      icon: jupyter-plain
      detail: For data exploration and quick experiments.
    - name: Kamal
      lucide: ship
      detail: Zero-downtime deploys for Rails apps.
    - name: SOPS
      lucide: lock
      detail: Encrypted, version-controlled secrets.

- group: Hardware
  icon: laptop
  items:
    - name: Laptop
      lucide: laptop
      detail: MacBook Pro (M3 Max, Apple Silicon) running macOS.
    - name: Keyboard
      lucide: keyboard
      detail: Apple Magic Keyboard.
    - name: Mouse
      lucide: mouse-pointer-2
      detail: Apple Magic Mouse.
    - name: Monitor
      lucide: monitor
      detail: LG UltraFine 4K (27") external display.

- group: Apps & Services
  icon: app-window
  items:
    - name: Design
      icon: figma-plain
      detail: Figma for UI design.
    - name: Diagrams
      lucide: workflow
      detail: Mermaid AI for diagrams and flowcharts.
    - name: Music
      lucide: music
      detail: Spotify and YouTube Music on while I code.
    - name: Browser
      lucide: globe
      detail: Firefox, Brave, and Chrome.
    - name: Notes
      lucide: notebook-pen
      detail: Google Keep and Apple Notes.
